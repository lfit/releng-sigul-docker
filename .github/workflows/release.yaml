name: Release Tag

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

# Never let two releases race to push the same image tags.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  docker:
    name: "Publish image"
    runs-on: ubuntu-latest
    # Run in the 'release' environment so the Docker Hub credentials can be
    # scoped to it, and publishing gated by its protection rules.
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: |
            lfreleng/sigul
          # For git tag "v1.2.3", we will create image tags of "latest", "1",
          # "1.2", and "1.2.3".
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      # The image is built for linux/amd64 only (the sigul RPM is x86_64),
      # so QEMU emulation is not needed.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: "."
          push: true
          tags: ${{ steps.meta.outputs.tags }}
